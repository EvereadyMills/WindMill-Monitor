name: Windmill Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests pytz

      - name: Run Monitor Script
        env:
          SCADA_USER: ${{ secrets.SCADA_USER }}
          SCADA_PASS: ${{ secrets.SCADA_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTER_DATA_JSON: ${{ secrets.MASTER_DATA_JSON }}
        run: python windmill_monitor.py

      - name: Commit and Push updated state file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add turbine_states.json || true
          git commit -m "Update turbine states" || exit 0
          git push
