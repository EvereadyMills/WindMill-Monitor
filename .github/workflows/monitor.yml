name: Windmill Monitor

on:
  schedule:
    # Every 15 mins, avoiding :00 (GitHub delays/skips top-of-hour runs)
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

# Never let two runs overlap (prevents double PDF / double report)
concurrency:
  group: windmill-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests pytz webdriver-manager

      - name: Run Monitor Script
        env:
          SCADA_USER: ${{ secrets.SCADA_USER }}
          SCADA_PASS: ${{ secrets.SCADA_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTER_DATA_JSON: ${{ secrets.MASTER_DATA_JSON }}
        run: python windmill_monitor.py

      - name: Commit and Push updated state files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add turbine_states.json || true
          git add report_log.json || true
          git commit -m "Update turbine states" || exit 0
          git pull --rebase || true
          git push
